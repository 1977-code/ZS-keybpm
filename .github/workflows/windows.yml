name: Windows VST3

# Builds the Windows VST3 with the MSVC toolchain used to ship most JUCE plug-ins,
# wraps it in the branded Inno Setup installer, and uploads both as artifacts. Runs
# on every push to main/master and can be triggered by hand from the Actions tab.
#
# The MSVC environment is loaded explicitly (msvc-dev-cmd) and the build is driven
# by Ninja, rather than relying on CMake's Visual Studio generator to locate the
# toolchain — that detection is brittle across runner-image updates.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch JUCE
        run: git clone --depth 1 --branch master https://github.com/juce-framework/JUCE.git JUCE

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DZSKEYBPM_COPY_AFTER_BUILD=OFF
          -DZSKEYBPM_BUILD_TESTS=ON

      - name: Build plug-in
        run: cmake --build build --target ZSkeybpm_VST3

      - name: Build and run DSP checks
        run: |
          cmake --build build --target ZSkeybpmTests
          & "build/ZSkeybpmTests_artefacts/Release/ZSkeybpmTests.exe"

      - name: Stage artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist/vst3 | Out-Null
          Copy-Item -Recurse "build/ZSkeybpm_artefacts/Release/VST3/ZS-keybpm.vst3" dist/vst3/

      # Uploaded before the installer is built: if ISCC ever fails, the plug-in that
      # did build is still there to download instead of the run yielding nothing.
      # The path is the staging directory, not the bundle — upload-artifact roots the
      # zip at a single directory path, which would drop the .vst3 folder itself.
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ZS-keybpm-VST3-Windows-x64
          path: dist/vst3
          if-no-files-found: error

      - name: Read version
        id: version
        shell: pwsh
        run: |
          # @() so a single match and no match behave the same way, and a missing
          # version fails the step instead of quietly shipping an unnamed installer.
          $match = @(Select-String -Path CMakeLists.txt -Pattern 'project\(ZSkeybpm VERSION ([0-9.]+)')[0]

          if (-not $match) {
              throw "no project(ZSkeybpm VERSION ...) line in CMakeLists.txt"
          }

          $value = $match.Matches[0].Groups[1].Value
          Write-Host "version $value"
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup ships on the windows runner images, but not reliably on PATH —
          # the MSVC dev environment rewrites PATH before this step runs. So ISCC is
          # searched for, and every candidate is printed: if a future image moves it,
          # the log says where it went instead of only that it was missing.
          #
          # Not version-gated. ISCC.exe carries no file version (it reports 0.0.0.0),
          # so any such check rejects a perfectly good compiler. The script needs
          # Inno Setup 6.3 or newer for "x64compatible"; an older one fails right
          # below with ISCC's own unambiguous message about the identifier.
          function Find-Iscc {
              # The real executable ahead of the chocolatey shim, and PATH last.
              $candidates = @(
                  (Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files" `
                                 -Filter "Inno Setup*" -Directory -ErrorAction SilentlyContinue |
                       ForEach-Object { Join-Path $_.FullName "ISCC.exe" })
                  "C:\ProgramData\chocolatey\bin\ISCC.exe"
                  (Get-Command iscc.exe -ErrorAction SilentlyContinue | ForEach-Object Source)
              ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

              foreach ($path in $candidates) { Write-Host "  found $path" }

              return $candidates | Select-Object -First 1
          }

          Write-Host "looking for ISCC:"
          $iscc = Find-Iscc

          if (-not $iscc) {
              Write-Host "not found — installing Inno Setup"
              choco install innosetup -y --no-progress
              $iscc = Find-Iscc
          }

          if (-not $iscc) {
              throw "no ISCC.exe anywhere — Inno Setup 6.3+ is required to build the installer"
          }

          Write-Host "using $iscc"
          & $iscc /? 2>&1 | Select-Object -First 1 | ForEach-Object { Write-Host "  $_" }

          & $iscc "/DVersion=${{ steps.version.outputs.value }}" `
                  "/DSourceDir=..\..\dist\vst3" `
                  "Installer\windows\ZS-keybpm.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed with exit code $LASTEXITCODE"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZS-keybpm-Installer-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
